[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectpilot-document-input"
version = "1.0.0"
description = "ProjectPilot PDF/DOCX document input pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]

[tool.setuptools.packages.find]
where = ["src"]


